# Include inside the HTTPS server block of the domain. Serves NIMA: Epochs at /nima/.
location = /nima {
    return 308 /nima/$is_args$args;
}
# Live stream: WebSocket upgrade, kept open by the server's 30-second pings.
location = /nima/ws {
    proxy_pass http://127.0.0.1:8090/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}
location ^~ /nima/ {
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
}
